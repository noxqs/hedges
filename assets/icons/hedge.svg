<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Hedge: a mini hedge — dark rounded panel, accent header, app tiles.
       The art deliberately fills most of the 64x64 box: panels scale the whole
       viewBox to the panel height, so any padding baked in here shows up as a
       smaller icon in the tray. -->
  <rect x="5" y="3" width="54" height="58" rx="13" fill="#12141c" fill-opacity="0.92"/>
  <rect x="5" y="3" width="54" height="58" rx="13" fill="none"
        stroke="#7aa2f7" stroke-width="3"/>
  <!-- header strip (top corners follow the panel radius) -->
  <rect x="5" y="3" width="54" height="16" rx="13" fill="#7aa2f7"/>
  <rect x="5" y="11" width="54" height="8" fill="#7aa2f7"/>
  <!-- app tiles -->
  <g fill="#e7e9f0">
    <rect x="13" y="26" width="11" height="11" rx="3.5"/>
    <rect x="27" y="26" width="11" height="11" rx="3.5"/>
    <rect x="41" y="26" width="11" height="11" rx="3.5"/>
    <rect x="13" y="43" width="11" height="11" rx="3.5"/>
    <rect x="27" y="43" width="11" height="11" rx="3.5"/>
  </g>
  <rect x="41" y="43" width="11" height="11" rx="3.5" fill="#7aa2f7"/>
</svg>
